name: Scheduled Inbox Janitor Run

# 1. Trigger the script on a schedule AND allow manual triggers from the UI
on:
  schedule:
    # Runs at 00:00 UTC (5:30 AM IST) every Monday morning
    - cron: "0 0 * * 1"
  workflow_dispatch: # Enables the "Run workflow" button manually in GitHub

jobs:
  janitor-run:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      # Step 1: Clone the code repository into the runner
      - name: Checkout Repository
        uses: actions/checkout@v5

      # Step 2: Boot up a clean, reliable Node.js environment
      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: "npm"

      # Step 3: Inject credentials secret
      - name: Inject Credentials Secret
        env:
          CREDENTIALS_CONTENT: ${{ secrets.CREDENTIALS_JSON }}
        run: |
          if [ -n "$CREDENTIALS_CONTENT" ]; then
            printf '%s' "$CREDENTIALS_CONTENT" > credentials.json
          fi

      # Step 4: Hydrate remaining environment and runtime token files
      - name: Inject Environment and Token Secrets
        env:
          ENV_CONTENT: ${{ secrets.ENV_FILE }}
          TOKEN_CONTENT: ${{ secrets.TOKEN_JSON }}
        run: |
          if [ -n "$ENV_CONTENT" ]; then
            printf '%s' "$ENV_CONTENT" > .env
          fi
          if [ -n "$TOKEN_CONTENT" ]; then
            printf '%s' "$TOKEN_CONTENT" > token.json
          fi

      # Step 5: Install your exact production and development dependencies
      - name: Install Dependencies
        run: npm ci

      # Step 6: Execute the janitor script!
      - name: Run Inbox Janitor
        run: npm run dev
